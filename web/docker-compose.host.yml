# LinJi·灵集 生产部署（本机特化：host 网络模式）
# 背景：本机 dockerd 的 iptables/nft 规则未建立（DOCKER 链缺失），
#       端口发布（DNAT）必失败且重启 dockerd 会波及 acg 业务。
#       → 两个容器均用 host 网络，应用直接绑宿主端口，绕开 NAT。
# 端口：linji 8899（8787/8788 已被其他业务占用）
# 注：原 douyin-api sidecar（8898）已下线 —— 抖音 / TikTok 采集整体移除。
services:
  linji:
    build:
      context: .
      network: host
    container_name: linji
    network_mode: host
    volumes:
      # 数据持久化：SQLite 库 + 上传/采集的媒体都在这里
      - ./server/data:/app/server/data
    environment:
      NODE_ENV: production
      PORT: "8899"
      # 缺失即拒绝启动（fail-fast），杜绝弱密钥上线；.env 已配置
      JWT_SECRET: ${JWT_SECRET:?请在 .env 或环境变量中设置 JWT_SECRET}
      COLLECT_PROXY: ""
    restart: unless-stopped
