# LinJi·灵集 生产部署（海外 VPS / 宝塔 Docker 管理器）
# 用法：先在 web/ 下准备 .env（cp .env.production.example .env 并填 JWT_SECRET），
#       然后 docker compose up -d --build
# JWT_SECRET 未设置时会拒绝启动（:? 语法），防止带弱密钥上线
services:
  # 注：原 douyin-api sidecar 已下线 —— 抖音 / TikTok 采集于 2026-10 整体移除
  # （其取流接口需登录态 cookie，V4.1.2 长期返回 403）。
  # 当前采集源仅保留：小红书 / Instagram / YouTube，统一走 yt-dlp 或平台 SSR 解析。
  linji:
    build:
      context: .
      # 构建期走宿主机网络：部分 VPS 的 DNS（systemd-resolved 私有地址）
      # 在构建容器里不可达，会报 Temporary failure resolving 'deb.debian.org'
      network: host
    container_name: linji
    ports:
      # 外部 8788（服务器 8787 已被其他 Node 项目占用）；容器内仍是 8787
      - "8788:8787"
    volumes:
      # 数据持久化：SQLite 库 + 上传/采集的媒体都在这里
      - ./server/data:/app/server/data
    environment:
      NODE_ENV: production
      PORT: "8787"
      # 缺失即拒绝启动（fail-fast），杜绝弱密钥上线
      JWT_SECRET: ${JWT_SECRET:?请在 .env 或环境变量中设置 JWT_SECRET（openssl rand -base64 48）}
      # 海外服务器直连小红书/Instagram/YouTube，无需代理（留空）
      COLLECT_PROXY: ""
    restart: unless-stopped
